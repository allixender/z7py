[workspace]
name = "z7py"
authors = ["Alexander Kmoch <alexander.kmoch@ut.ee>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64", "osx-64"]
version = "0.1.0"

[tasks]
test = "pytest -q"
build = "python -m build"

[dependencies]
python = ">=3.10"
numpy = ">=1.24"
numba = ">=0.60"
pytest = ">=7"
python-build = "*"

[pypi-dependencies]
z7py = { path = ".", editable = true }

[feature.docs.dependencies]
sphinx = ">=8"
sphinx_rtd_theme = ">=3"
myst-parser = ">=4"

[feature.docs.tasks]
docs = "sphinx-build -b html docs/source docs/build/html"

[environments]
docs = ["docs"]
