[workspace]
name = "z7py"
authors = ["Alexander Kmoch <alexander.kmoch@ut.ee>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64", "osx-64"]
version = "0.1.0"

[tasks]
test = "pytest -q"
build = "python -m build"

[dependencies]
python = ">=3.10"
numpy = ">=1.24"
numba = ">=0.60"
pytest = ">=7"
python-build = "*"

[pypi-dependencies]
z7py = { path = ".", editable = true }
