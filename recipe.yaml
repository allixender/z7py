# rattler-build recipe for z7py.
#
# Default: builds straight from this checkout, so it needs nothing on PyPI.
#   rattler-build build --recipe recipe.yaml
#   rattler-build upload prefix --channel <your-channel> output/noarch/*.conda
#
# For a conda-forge submission later, swap the source below to the PyPI sdist
# form (staged-recipes requires a URL + checksum, not a local path):
#   source:
#     - url: https://pypi.org/packages/source/z/z7py/z7py-${{ version }}.tar.gz
#       sha256: <curl -sL $URL | shasum -a 256>
schema_version: 1

context:
  name: z7py
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - path: .
    use_gitignore: true

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - hatchling
    - pip
  run:
    - python >=3.10
    - numpy >=1.24
    - numba >=0.60

tests:
  - python:
      imports:
        - z7py
      pip_check: true
  - script:
      - pytest -q tests
    requirements:
      run:
        - pytest >=7
    files:
      source:
        - tests/

about:
  homepage: https://github.com/allixender/z7py
  repository: https://github.com/allixender/z7py
  summary: Z7 (IGEO7/ISEA7H) discrete global grid indexing and neighbour traversal in NumPy and Numba
  description: |
    z7py implements the Z7 indexing system for the IGEO7 / ISEA7H aperture-7
    hexagonal discrete global grid, based on the Generalized Balanced Ternary
    (GBT) numeral system with the alternating CW/CCW rotation pattern.

    Z7 indices are bit-packed into a single uint64 (4 bits base cell, 20 x 3
    bits resolution digits), which makes neighbour traversal, parent/child
    navigation and monotonic range arithmetic pure integer operations. The
    hot paths are JIT-compiled with Numba.

    The package is deliberately thin: it depends only on NumPy and Numba, and
    needs neither the DGGRID binary nor a geospatial stack, so it can be used
    inside Numba nopython kernels and on bare compute workers.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - allixender
