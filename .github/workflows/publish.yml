name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # required for PyPI Trusted Publishing (no API token needed)
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  conda:
    name: Publish to prefix.dev
    runs-on: ubuntu-latest
    # PyPI first: recipe.yaml pulls the published sdist
    needs: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Build conda package
        run: rattler-build build --recipe recipe.yaml --output-dir ./conda-bld

      - name: Upload to prefix.dev
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          rattler-build upload prefix \
            --channel z7py \
            ./conda-bld/noarch/*.conda
