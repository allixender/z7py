name: Publish

# A GitHub release publishes to both prefix.dev and PyPI. The two jobs are
# independent — the conda recipe builds from this checkout and does not need a
# PyPI release. Manual runs pick their targets, e.g. a TestPyPI dry run.
#
# PyPI uses Trusted Publishing (no API token): the publisher registered on
# pypi.org / test.pypi.org must name this workflow file (publish.yml) and the
# `release` environment.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      conda:
        description: "Publish to prefix.dev"
        type: boolean
        default: false
      pypi:
        description: "Publish to PyPI"
        type: choice
        options: [none, testpypi, pypi]
        default: none

jobs:
  conda:
    name: Publish to prefix.dev
    if: ${{ github.event_name == 'release' || inputs.conda }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Build
        run: rattler-build build --recipe recipe.yaml --output-dir ./output

      - name: Upload
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          if [ -z "$PREFIX_API_KEY" ]; then
            echo "::error::PREFIX_API_KEY secret is not set"; exit 1
          fi
          if [ -z "${{ vars.PREFIX_CHANNEL }}" ]; then
            echo "::error::PREFIX_CHANNEL repository variable is not set"; exit 1
          fi
          rattler-build upload prefix \
            --channel "${{ vars.PREFIX_CHANNEL }}" \
            ./output/noarch/*.conda

  pypi:
    name: Publish to PyPI
    if: ${{ github.event_name == 'release' || inputs.pypi != 'none' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # PyPI Trusted Publishing; no API token needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      # PyPI versions are immutable, so refuse a release whose tag and
      # z7py.__version__ disagree.
      - name: Check tag matches version
        if: github.event_name == 'release'
        run: |
          if [ ! -f "dist/z7py-${GITHUB_REF_NAME#v}.tar.gz" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the built version"
            ls dist; exit 1
          fi

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.pypi == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
